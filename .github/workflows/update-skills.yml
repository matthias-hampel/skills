name: Update skills

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPDATE_BRANCH: automation/update-skills
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download current skill versions
        run: python3 scripts/update-skills.py --all

      - name: Commit and open pull request
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- skills)" ]]; then
            echo "All skills are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add skills
          git commit -m "chore: update skills"
          git push --force-with-lease --set-upstream origin "$UPDATE_BRANCH"

          pr_number="$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "chore: update skills" \
              --body $'Updates vendored skills from their SOURCE.md definitions.\n\nReview changes to SKILL.md and executable scripts before merging.'
          else
            echo "Updated pull request #$pr_number."
          fi
